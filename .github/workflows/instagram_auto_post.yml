name: Instagram Auto Post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing to Instagram"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_posts:
        description: "Maximum new products to post"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_by_scraping.py

      - name: Run Instagram post test
        if: ${{ inputs.dry_run == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python instagram_auto_post.py --dry-run --sync-existing --max-posts "${{ inputs.max_posts }}"

      - name: Publish new Instagram posts
        if: ${{ inputs.dry_run == 'false' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python instagram_auto_post.py --publish --sync-existing --max-posts "${{ inputs.max_posts }}"

      - name: Commit feed and posted state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if [ -f instagram_posted_items.json ]; then
            git add instagram_posted_items.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "chore: update Instagram post state @ ${DATE}"
            git push origin HEAD
          fi
