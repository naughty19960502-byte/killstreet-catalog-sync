name: Weekly Instagram Feed Sync

on:
  schedule:
    # 毎週月曜日 09:00 UTC = 18:00 JST
    - cron: "0 9 * * 1"
  workflow_dispatch:   # 手動実行ボタン

permissions:
  contents: write

jobs:
  sync-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_by_scraping.py

      - name: Commit and push feed.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes — feed is up to date"
          else
            COUNT=$(grep -c '<g:id>' docs/feed.xml || echo 0)
            DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "chore: sync docs/feed.xml [${COUNT} items] @ ${DATE}"
            git push origin HEAD
          fi
